[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domstudio"
version = "2.0.0a1"
description = "Topology-aware fracture detection, vectorization, and guided tracing"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE.txt"}
authors = [
  {name = "GECOS Lab"},
]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
  "PyQt5>=5.15.9",
  "rasterio>=1.3",
  "shapely>=2.0",
  "geopandas>=0.14",
]

[project.optional-dependencies]
learned = ["torch>=2.2", "onnx>=1.16", "onnxruntime>=1.18"]
inference = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.gui-scripts]
domstudio = "domstudio.application:main"

[tool.setuptools.packages.find]
include = ["domstudio*"]

[tool.setuptools.package-data]
"domstudio.ui" = ["assets/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
